<div class="pos-layout">
  <!-- Top Navbar -->
  <mat-toolbar color="primary" class="pos-toolbar">
    <span>☕ Happiness Cafe</span>
    <span class="spacer"></span>

    <nav class="pos-nav">
      <a mat-button routerLink="/pos/billing" routerLinkActive="nav-active">
        <mat-icon>point_of_sale</mat-icon>
        <span>New Bill</span>
      </a>
      <a mat-button routerLink="/pos/bills" routerLinkActive="nav-active">
        <mat-icon>receipt_long</mat-icon>
        <span>Today's Bills</span>
      </a>
    </nav>

    <a
      mat-icon-button
      class="cart-header-toggle"
      routerLink="/pos/cart"
      [attr.aria-label]="'Cart, ' + cartService.itemCount + ' items'">
      <mat-icon>shopping_cart</mat-icon>
      <span *ngIf="cartService.itemCount > 0" class="cart-count">{{ cartService.itemCount }}</span>
    </a>

    <span class="spacer"></span>
    <span class="seller-name">{{ authService.getUser()?.name }}</span>
    <button mat-icon-button (click)="authService.logout()" matTooltip="Logout" aria-label="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <!-- Billing Content -->
  <div class="billing-container">
    <div class="billing-content">
      <!-- Menu Section -->
      <div class="menu-section">
        <div class="category-chips">
          <mat-chip-listbox>
            <mat-chip-option
              *ngFor="let category of categories"
              [selected]="selectedCategory === category"
              (click)="selectCategory(category)">
              {{ category }}
            </mat-chip-option>
          </mat-chip-listbox>
        </div>

        <div *ngIf="menuItems.length === 0" class="empty-menu">
          <mat-icon>menu_book</mat-icon>
          <p>No menu items available</p>
        </div>

        <div class="menu-grid">
          <mat-card *ngFor="let item of filteredMenuItems" class="menu-item-card">
            <mat-card-header>
              <mat-card-title>{{ item.name }}</mat-card-title>
              <mat-card-subtitle>{{ item.category }}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
              <p class="price">₹{{ item.price.toFixed(2) }}</p>
            </mat-card-content>
            <mat-card-actions>
              <button mat-raised-button color="primary" (click)="addToCart(item)" class="full-width">
                <mat-icon>add_shopping_cart</mat-icon>
                Add to Cart
              </button>
            </mat-card-actions>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
